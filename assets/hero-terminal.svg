<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="30" y="46" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.02;0.06;0.95;1" values="0;0;100;100;0"/></rect></clipPath>
    <clipPath id="clip2"><rect x="30" y="76" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.08;0.16;0.95;1" values="0;0;380;380;0"/></rect></clipPath>
    <clipPath id="clip3"><rect x="30" y="116" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.20;0.24;0.95;1" values="0;0;170;170;0"/></rect></clipPath>
    <clipPath id="clip4"><rect x="30" y="146" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.26;0.38;0.95;1" values="0;0;400;400;0"/></rect></clipPath>
    <clipPath id="clip5"><rect x="30" y="186" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.42;0.48;0.95;1" values="0;0;240;240;0"/></rect></clipPath>
    <clipPath id="clip6"><rect x="30" y="216" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.50;0.58;0.95;1" values="0;0;280;280;0"/></rect></clipPath>
    <clipPath id="clip7"><rect x="30" y="256" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.62;0.67;0.95;1" values="0;0;220;220;0"/></rect></clipPath>
    <clipPath id="clip8"><rect x="30" y="286" height="22"><animate attributeName="width" dur="12s" repeatCount="indefinite"
      keyTimes="0;0.69;0.75;0.95;1" values="0;0;210;210;0"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="760" height="380" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0" y="0" width="760" height="34" rx="12" fill="#161b22"/>
  <rect x="0" y="22" width="760" height="12" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="21" font-size="12" fill="#8b949e" text-anchor="middle">manuel@portfolio: ~</text>

  <!-- lines -->
  <g clip-path="url(#clip1)">
    <text y="62" font-size="15"><tspan x="30" fill="#58a6ff">$ </tspan><tspan fill="#c9d1d9">whoami</tspan></text>
  </g>
  <g clip-path="url(#clip2)">
    <text x="30" y="92" font-size="15" fill="#7ee787">Manuel Romero — Full Stack Developer</text>
  </g>

  <g clip-path="url(#clip3)">
    <text y="132" font-size="15"><tspan x="30" fill="#58a6ff">$ </tspan><tspan fill="#c9d1d9">cat focus.txt</tspan></text>
  </g>
  <g clip-path="url(#clip4)">
    <text x="30" y="162" font-size="15" fill="#7ee787">Building AgentDate, NutriCate &amp; RouteNia</text>
  </g>

  <g clip-path="url(#clip5)">
    <text y="202" font-size="15"><tspan x="30" fill="#58a6ff">$ </tspan><tspan fill="#c9d1d9">whatsapp-bot --status</tspan></text>
  </g>
  <g clip-path="url(#clip6)">
    <text x="30" y="232" font-size="15" fill="#3fb950">✓ Evolution API conectada</text>
  </g>

  <g clip-path="url(#clip7)">
    <text y="272" font-size="15"><tspan x="30" fill="#58a6ff">$ </tspan><tspan fill="#c9d1d9">echo $AVAILABILITY</tspan></text>
  </g>
  <g clip-path="url(#clip8)">
    <text x="30" y="302" font-size="16" font-weight="bold" fill="#39ff14">open_to_work: true</text>

    <!-- blinking cursor -->
    <rect x="205" y="288" width="9" height="16" fill="#39ff14">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
